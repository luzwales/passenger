# Automatic builds on every push to main or a v* tag (and manual runs):
# - Push to main: builds self-contained Release packages & portable archives for Windows (x64), Linux (x64), and
#   macOS (arm64, x64) as workflow artifacts.
# - Push of a vX.Y.Z tag: runs the full Packaging + GitHub Release publish for luzwales/passenger (creating/updating
#   the GitHub Release with installers, portable zips, SHA256SUMS, and Velopack releases.<rid>.json feeds).
name: Auto Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip gate tests before packaging
        type: boolean
        default: false
      publish_release:
        description: Publish a GitHub Release when run on a vX.Y.Z tag
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish_release }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(git describe --tags --exact-match --match 'v[0-9]*' 2> /dev/null || true)
          fi
          if [ -z "$tag" ]; then
            version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          elif echo "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            version=${tag#v}
          else
            echo "::error title=Invalid release tag::$tag must match vX.Y.Z"
            exit 1
          fi
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ] && { [ "$EVENT_NAME" = push ] || [ "$PUBLISH_INPUT" = true ]; }; then
            publish=true
          fi
          echo "Passenger $version${tag:+ ($tag)} publish=$publish"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  checks:
    name: Checks & Notices
    needs: version
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore locked
        run: dotnet restore Passenger.slnx --locked-mode

      - name: Verify notices and comments
        run: |
          python3 -I tools/check-notices.py
          python3 -I tools/check-comments.py

  test:
    name: Gate Tests
    needs: version
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/test.yml
    with:
      report: false

  debug-relay:
    name: Debug relay
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: The Android workload
        run: dotnet workload install android

      - name: Build the relays
        run: |
          tools/debug-relay.sh android apple
          for part in android-arm64/libpassenger-debug.so android-x64/libpassenger-debug.so ios-arm64/libpassenger-debug.dylib iossimulator-arm64/libpassenger-debug.dylib \
            maccatalyst-arm64/libpassenger-debug.dylib maccatalyst-x64/libpassenger-debug.dylib; do
            [ -s "artifacts/debug-relay/$part" ] || { echo "No $part" >&2; exit 1; }
          done

      - name: Upload the relays
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-relay
          path: artifacts/debug-relay/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package (${{ matrix.rid }})
    needs: [version, checks, test, debug-relay]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.checks.result == 'success' && needs.debug-relay.result == 'success' && (needs.test.result == 'success' || (inputs.skip_tests && needs.test.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-26.04
          - rid: linux-arm64
            os: ubuntu-26.04
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: An Intel .NET SDK for the check
        if: matrix.rid == 'osx-x64'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-intel
        with:
          global-json-file: global.json
          architecture: x64
          skip-lts-prepass: true

      - name: Rosetta
        if: matrix.rid == 'osx-x64'
        run: |
          arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          for root in "$RUNNER_TEMP/dotnet-intel/x64" "$RUNNER_TEMP/dotnet-intel"; do
            [ ! -x "$root/dotnet" ] || break
          done
          arch -x86_64 "$root/dotnet" --version
          echo "DOTNET_ROOT_X64=$root" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: The debug relays
        uses: actions/download-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-relay
          path: artifacts/debug-relay

      - name: Make and check the disk image
        if: runner.os == 'macOS'
        run: tools/package-mac.sh "$RID"

      - name: Build the installer
        if: runner.os == 'Windows'
        run: tools/package-win.sh "$RID"

      - name: The libraries Passenger needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file libx11-6 libice6 libsm6 libfontconfig1

      - name: Make and check the archive
        if: runner.os == 'Linux'
        run: tools/package-linux.sh "$RID"

      - name: Gather package files
        run: |
          mkdir -p artifacts/release
          case $RID in
            osx-*)
              cp "artifacts/package/Passenger-macos-${RID#osx-}.dmg" "artifacts/package/Passenger-macos-${RID#osx-}.zip" artifacts/release/
              ;;
            win-*)
              cp "artifacts/package/Passenger-windows-${RID#win-}.exe" "artifacts/package/Passenger-windows-${RID#win-}-portable.zip" \
                "artifacts/package/$RID/velopack/releases.$RID.json" "artifacts/package/$RID/velopack/PassengerIDE-$VERSION-$RID-full.nupkg" \
                artifacts/release/
              ;;
            linux-*)
              cp "artifacts/package/Passenger-linux-${RID#linux-}.tar.gz" artifacts/release/
              ;;
          esac
          ls -l artifacts/release

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-package-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  container-tools:
    name: Container tools (${{ matrix.rid }})
    needs: [version, checks, test]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.checks.result == 'success' && (needs.test.result == 'success' || (inputs.skip_tests && needs.test.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore cached NuGet packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Publish and pack
        run: |
          tools/container-tools.sh "$RID" --archive
          mkdir -p artifacts/release
          cp "artifacts/container-tools/Passenger-container-tools-$RID.tar.gz" artifacts/release/

      - name: Upload container tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-package-container-tools-${{ matrix.rid }}
          path: artifacts/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assets:
    name: Bundle All Packages
    needs: [version, package, container-tools]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.package.result == 'success' && needs.container-tools.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: auto-package-*
          path: release/assets
          merge-multiple: true

      - name: Checksums and notes
        working-directory: release/assets
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Notes
        run: |
          tools/release-notes.sh ${TAG:+"$TAG"} > release/notes.md

      - name: Upload combined bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Passenger-${{ needs.version.outputs.version }}
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [version, assets]
    if: ${{ !cancelled() && needs.assets.result == 'success' && needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Passenger-${{ needs.version.outputs.version }}
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/assets/* --clobber
          else
            gh release create "$TAG" release/assets/* --verify-tag --title "Passenger $VERSION" --notes-file release/notes.md
          fi
